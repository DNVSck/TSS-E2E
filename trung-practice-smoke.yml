# =============================================================================
# Practice pipeline - Trung
# Manual trigger plus a daily 09:00 (Vietnam time) smoke run over tests/functional.
#
# This is the clean source. It is not wired to any pipeline yet: registering a
# pipeline needs permissions I do not have, so the same content currently also
# lives in run-tests.yml on this branch, which is where the existing
# "TSS-E2E Tests" pipeline reads from. Keep the two in sync.
# =============================================================================

parameters:
  - name: environment
    displayName: 'Environment'
    type: string
    default: sit
    values:
      - sit
      - test

# --- Trigger 1: manual only --------------------------------------------------
trigger: none
pr: none

# --- Trigger 2: daily at 09:00 Vietnam time ----------------------------------
# Azure DevOps cron runs in UTC. 09:00 UTC+7 is 02:00 UTC.
# Azure reads schedules from the pipeline's default branch, so that setting must
# point at the branch holding this file or the schedule never fires.
schedules:
  - cron: '0 2 * * *'
    displayName: 'Daily functional smoke (09:00 Vietnam time)'
    branches:
      include:
        - trung/practice-pipeline-config
    always: true                            # run even with no new commits

# --- Variable groups, selected to match their exact casing -------------------
# Not built as TSS-${{ parameters.environment }}: the groups are capitalised
# (TSS-Sit / TSS-Test) while ENV must stay lowercase for the .env.<env>
# convention, so one string cannot serve both.
variables:
  - group: TSS-Secrets                      # NPM_TOKEN for the install step
  - ${{ if eq(parameters.environment, 'sit') }}:
      - group: TSS-Sit
  - ${{ if eq(parameters.environment, 'test') }}:
      - group: TSS-Test

pool:
  name: Linux

jobs:
  - job: FunctionalSmoke
    displayName: 'Functional smoke (${{ parameters.environment }})'
    timeoutInMinutes: 60
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - checkout: self

      - script: |
          cd "$(Build.SourcesDirectory)"
          set -e
          npx pnpm install --frozen-lockfile
        displayName: 'Install dependencies'
        env:
          NPM_TOKEN: $(NPM_TOKEN)

      - script: |
          cd "$(Build.SourcesDirectory)"
          set -e
          npx playwright test tests/functional \
            --grep @smoke \
            --project=chromium-en
        displayName: 'Run functional smoke tests'
        env:
          # --- General configuration ---
          ENV: ${{ parameters.environment }}
          CI: true
          HEADLESS: true
          OTP_ENABLED: true               # sit and test both enforce the TOTP step
          PLAYWRIGHT_HTML_OPEN: never
          # Overrides the "CI => 1 worker" default in playwright.config.ts. The
          # ceiling is the size of the AGENT account pool (currently 4), because
          # each worker needs its own session - see credentials.ts accountFor().
          WORKERS: 3
          # JAVA_HOME is deliberately not set: $(JAVA_HOME_21_X64) is a path on
          # the agent host and does not exist inside the container.

          # --- Timeouts ---
          # .env.* is gitignored, so no env file reaches CI: bootstrap-env.ts
          # finds nothing and every timeout silently falls back to the defaults
          # in playwright.config.ts. That left each test with 30s to complete a
          # whole declaration journey, so runs died mid-click with
          # "locator resolved to <button> ... Test ended". These mirror .env.sit
          # so CI behaves like a local run.
          TEST_BASE_TIMEOUT: 300000
          EXPECT_BASE_TIMEOUT: 30000
          PAGE_TIMEOUT: 30000
          # 15s rather than the 5s default: the commodity field is a live tariff
          # autocomplete, and 5s is not enough for it once three workers are
          # sharing a container and hitting that API at once.
          DEFAULT_TIMEOUT: 15000

          # --- Non-secret variables (auto-exported, listed for visibility) ---
          BASE_URL: $(BASE_URL)
          HAULIER_COMPANY_NAME: $(HAULIER_COMPANY_NAME)
          AGENT_USER_NAME_1: $(AGENT_USER_NAME_1)
          AGENT_USER_NAME_2: $(AGENT_USER_NAME_2)
          AGENT_USER_NAME_3: $(AGENT_USER_NAME_3)
          AGENT_USER_NAME_4: $(AGENT_USER_NAME_4)

          # --- Secrets: mapping these is mandatory. Azure never auto-exports a
          # secret variable to a script, so without them the pool accounts
          # resolve with no password and sign-in fails. ---
          AGENT_PASSWORD: $(AGENT_PASSWORD)
          AGENT_TOTP_SECRET_1: $(AGENT_TOTP_SECRET_1)
          AGENT_TOTP_SECRET_2: $(AGENT_TOTP_SECRET_2)
          AGENT_TOTP_SECRET_3: $(AGENT_TOTP_SECRET_3)
          AGENT_TOTP_SECRET_4: $(AGENT_TOTP_SECRET_4)
          CARRIER_EORI: $(CARRIER_EORI)

      # Rendering the report on this agent has two dead ends: the Allure CLI is
      # a Java tool and the Playwright image ships no JRE, while the container
      # runs as uid 1003 with no sudo so apt-get cannot supply one. Moving the
      # work to `target: host` failed too - mixing container and host steps in
      # one job leaves _work/_temp owned by the container uid, and the host user
      # then hits EACCES on _temp/.taskkey.
      #
      # src/core/report/export-allure-pdf.mts renders the same allure-results
      # with Puppeteer instead. Puppeteer is already a dependency and already
      # launches with --no-sandbox, so this needs no Java and no extra
      # privileges: it runs inside the container like every other step.
      #
      # Backticks, not $(...), for command substitution: $(...) is Azure's own
      # variable macro and is replaced before bash ever runs.
      - script: |
          cd "$(Build.SourcesDirectory)"
          if [ ! -d allure-results ]; then
            echo "No allure-results directory, nothing to export."
            exit 0
          fi
          # Prefer the browser the Playwright image already ships, so the export
          # does not depend on Puppeteer having downloaded its own copy.
          CHROME=`ls -d /ms-playwright/chromium-*/chrome-linux/chrome 2>/dev/null | head -1`
          if [ -n "$CHROME" ]; then
            export PUPPETEER_EXECUTABLE_PATH="$CHROME"
            echo "Using browser: $CHROME"
          else
            echo "No Playwright chromium found, falling back to Puppeteer's own."
          fi
          mkdir -p test-results
          set -e
          npx pnpm report:pdf
          ls -la test-results/allure-report.pdf
        displayName: 'Export Allure report to PDF'
        condition: always()
        continueOnError: true

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Allure PDF report'
        condition: always()
        continueOnError: true
        inputs:
          pathToPublish: '$(Build.SourcesDirectory)/test-results/allure-report.pdf'
          artifactName: 'functional-smoke-allure-pdf-$(Build.BuildId)'

      # Publishes JUnit results, the Playwright report and the raw Allure results
      - template: templates/publish-test-artifacts.yml
        parameters:
          testType: functional-smoke
          environment: ${{ parameters.environment }}

      # Frees disk on the self-hosted agent
      - template: templates/cleanup.yml
