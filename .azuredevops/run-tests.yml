parameters:
  - name: environment
    displayName: 'Environment to run against'
    type: string
    default: test
    values:
      - test
      - sit
      - sit2
      - dev

  - name: testScope
    displayName: 'Test Scope'
    type: string
    default: smoke
    values:
      - smoke
      - all
      - regression
      - standalone
      - ens-integrated

  - name: testFilter
    displayName: 'Custom Filter (--grep regex on test title; include @ for tags, e.g. @smoke. "none" = use Test Scope)'
    type: string
    default: 'none'

  - name: workers
    displayName: 'Parallel Playwright workers'
    type: number
    default: 4
    values:
      - 1
      - 2
      - 3
      - 4

  - name: shards
    displayName: 'Agents to split the run across (each runs the workers above, on its own accounts)'
    type: number
    default: 2
    values:
      - 1
      - 2

  - name: runAccessibilityTests
    displayName: 'Run Accessibility Tests'
    type: boolean
    default: false

  - name: runFunctionalTests
    displayName: 'Run Functional Tests'
    type: boolean
    default: true

  - name: runAll
    displayName: 'Run All Test Types (overrides selections above)'
    type: boolean
    default: false

  - name: notifyTeams
    displayName: 'Send Teams notification'
    type: boolean
    default: true

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
      - group: TSS-E2E-DEV
  - ${{ if eq(parameters.environment, 'test') }}:
      - group: TSS-E2E-TEST
  - ${{ if eq(parameters.environment, 'sit') }}:
      - group: TSS-E2E-SIT
  - ${{ if eq(parameters.environment, 'sit2') }}:
      - group: TSS-E2E-SIT2

trigger: none

pr:
  branches:
    include:
      - main

pool:
  name: TSS-NonProd-EKS

jobs:
  - template: templates/sharded-test-jobs.yml
    parameters:
      jobName: Test
      displayName: 'Run tests - ${{ parameters.environment }}'
      environment: ${{ parameters.environment }}
      testScope: ${{ parameters.testScope }}
      testFilter: ${{ parameters.testFilter }}
      workers: ${{ parameters.workers }}
      shards: ${{ parameters.shards }}
      runAccessibilityTests: ${{ parameters.runAccessibilityTests }}
      runFunctionalTests: ${{ parameters.runFunctionalTests }}
      runAll: ${{ parameters.runAll }}
      notifyTeams: ${{ parameters.notifyTeams }}
