trigger: none

pr: none

schedules:
  - cron: "0 4 * * 1-5" # UTC, Monday-Friday only
    displayName: Nightly regression (test + sit)
    branches:
      include:
        - main
    always: true

pool:
  name: TSS-NonProd-EKS

jobs:
  - template: templates/sharded-test-jobs.yml
    parameters:
      jobName: FunctionalTests_test
      displayName: 'Run functional regression - test'
      environment: test
      variableGroup: TSS-E2E-TEST
      testScope: regression
      testFilter: none
      workers: 4
      shards: 2

  - template: templates/sharded-test-jobs.yml
    parameters:
      jobName: FunctionalTests_sit
      displayName: 'Run functional regression - sit'
      environment: sit
      variableGroup: TSS-E2E-SIT
      testScope: regression
      testFilter: none
      workers: 4
      shards: 2
