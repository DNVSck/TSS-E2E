parameters:
  - name: environment
    type: string

steps:
  - task: NodeTool@0
    displayName: Setup Node 24
    inputs:
      versionSpec: '24.x'

  - checkout: self

  - script: |
      set -euo pipefail
      cd "$(Build.SourcesDirectory)"

      ENVIRONMENT="${{ parameters.environment }}"

      if [[ ! "$ENVIRONMENT" =~ ^[A-Za-z0-9_-]+$ ]]; then
        echo "ERROR: Invalid environment name: $ENVIRONMENT"
        exit 1
      fi

      echo "Node version:"
      node --version

      echo "Corepack version:"
      corepack --version

      npm config set registry https://registry.npmjs.org/

      echo "Installing dependencies with the pnpm version pinned in package.json..."
      corepack pnpm --version
      corepack pnpm install --frozen-lockfile

      # System dependencies for Chromium are baked into the agent image.
      # Do not add --with-deps here: it requires sudo and hangs on this pool.
      echo "Installing Playwright Chromium..."
      npx playwright install chromium

      echo "Environment preparation completed for: $ENVIRONMENT"

    displayName: 'Install dependencies and prepare environment'

    env:
      CI: 'true'
