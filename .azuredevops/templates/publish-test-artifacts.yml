parameters:
  - name: environment
    type: string

  - name: testType
    type: string

steps:
  - script: |
      set -euo pipefail

      # Stage reports in the per-job temp dir (unique per run); clear it first.
      REPORT_DIR="$(Agent.TempDirectory)/reports"
      rm -rf "$REPORT_DIR"
      mkdir -p "$REPORT_DIR"

      for d in test-results playwright-report allure-results; do
        if [ -d "$(Build.SourcesDirectory)/$d" ]; then
          mv -f "$(Build.SourcesDirectory)/$d" "$REPORT_DIR/$d"
        fi
      done

      # Ensure a junit.xml exists so the Tests tab reflects this run (empty when tests did not run).
      if [ ! -f "$REPORT_DIR/test-results/junit.xml" ]; then
        mkdir -p "$REPORT_DIR/test-results"
        printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<testsuites tests="0" failures="0" errors="0" skipped="0"><testsuite name="none" tests="0" failures="0" errors="0" skipped="0" time="0"></testsuite></testsuites>' \
          > "$REPORT_DIR/test-results/junit.xml"
      fi

    displayName: 'Stage reports into agent temp dir'
    condition: always()

  - task: PublishTestResults@2
    displayName: 'Publish JUnit results - ${{ parameters.environment }}'
    condition: always()
    inputs:
      testResultsFormat: JUnit
      searchFolder: '$(Agent.TempDirectory)/reports'
      testResultsFiles: 'test-results/junit.xml'
      mergeTestResults: true
      failTaskOnFailedTests: false
      testRunTitle: '${{ parameters.testType }} tests - ${{ parameters.environment }}'

  - script: |
      set -euo pipefail
      RESULTS="$(Agent.TempDirectory)/reports/allure-results"
      TRIMMED="$(Agent.TempDirectory)/reports/allure-results-single"
      [ -d "$RESULTS" ] || exit 0

      # Traces and videos are excluded, and this report is only viable because they are.
      # Every attachment is inlined as base64, so the whole set has to be held in memory
      # to encode - measured at roughly ten times its own size. A run that kept the
      # traces produced a 72 MB index.html; the one that kept the videos never finished,
      # the step was killed and no artifact was published at all.
      #
      # Neither is a loss here. Allure cannot open a trace, it only offers a download.
      # What survives is what this report is for: which tests failed, the steps they
      # took, and the screenshot of the failure. Video and traces are published as their
      # own artifacts instead, one file per failed test, named after the test.
      rm -rf "$TRIMMED"
      mkdir -p "$TRIMMED"
      for f in "$RESULTS"/*; do
        case "$f" in *.zip|*.webm) continue;; esac
        cp "$f" "$TRIMMED"/
      done

      node "$(Build.SourcesDirectory)/node_modules/allure/cli.js" generate "$TRIMMED" --config "$(Build.SourcesDirectory)/allure.share.mjs" -o "$(Agent.TempDirectory)/reports/allure-report-single"
    displayName: 'Generate single-file Allure report'
    condition: always()
    continueOnError: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish single-file Allure report - ${{ parameters.environment }}'
    condition: always()
    continueOnError: true
    inputs:
      PathtoPublish: '$(Agent.TempDirectory)/reports/allure-report-single'
      ArtifactName: 'allure-report-single-${{ parameters.testType }}-${{ parameters.environment }}-$(Build.BuildId)'
      publishLocation: Container

  - script: |
      set -euo pipefail
      RESULTS="$(Agent.TempDirectory)/reports/test-results"
      VIDEOS="$(Agent.TempDirectory)/reports/failure-videos"
      TRACES="$(Agent.TempDirectory)/reports/failure-traces"
      rm -rf "$VIDEOS" "$TRACES"
      mkdir -p "$VIDEOS" "$TRACES"
      : > "$VIDEOS/index.txt"
      : > "$TRACES/index.txt"

      collect() {
        local src="$1" dir="$2" ext="$3" base="$4" full="$5"
        [ -f "$src" ] || return 1
        local target="$dir/$base.$ext"
        local n=1
        while [ -e "$target" ]; do
          target="$dir/$base ($n).$ext"
          n=$((n + 1))
        done
        cp "$src" "$target"
        echo "${target##*/}  <=  $full" >> "$dir/index.txt"
      }

      videos=0
      traces=0
      for dir in "$RESULTS"/*/; do
        [ -d "$dir" ] || continue
        [ -f "$dir/video.webm" ] || [ -f "$dir/trace.zip" ] || continue

        label=""
        if [ -f "$dir/error-context.md" ]; then
          label=$(sed -n 's/^- Name: //p' "$dir/error-context.md" | head -1)
        fi
        if [ -z "$label" ]; then
          label="${dir%/}"
          label="${label##*/}"
        fi

        spec="${label%% >> *}"
        spec="${spec//[^A-Za-z0-9 ().,_-]/ }"
        spec=$(echo "$spec" | tr -s ' ')
        spec="${spec##* }"
        spec="${spec%.spec.ts}"

        title="${label##* >> }"

        name="$spec - $title"
        name="${name//[^A-Za-z0-9 ().,_-]/ }"
        name=$(echo "$name" | tr -s ' ')
        name="${name# }"
        if [ ${#name} -gt 150 ]; then
          name="${name:0:100}...${name: -47}"
        fi

        if collect "$dir/video.webm" "$VIDEOS" webm "$name" "$label"; then videos=$((videos + 1)); fi
        if collect "$dir/trace.zip"  "$TRACES" zip  "$name" "$label"; then traces=$((traces + 1)); fi
      done

      echo "Failure videos collected: $videos"
      echo "Failure traces collected: $traces"

      [ "$videos" -gt 0 ] || echo 'No failed tests in this run.' > "$VIDEOS/index.txt"
      [ "$traces" -gt 0 ] || echo 'No failed tests in this run.' > "$TRACES/index.txt"

    displayName: 'Collect failure videos and traces - ${{ parameters.environment }}'
    condition: always()
    continueOnError: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish failure videos - ${{ parameters.environment }}'
    condition: always()
    continueOnError: true
    inputs:
      PathtoPublish: '$(Agent.TempDirectory)/reports/failure-videos'
      ArtifactName: 'failure-videos-${{ parameters.testType }}-${{ parameters.environment }}-$(Build.BuildId)'
      publishLocation: Container

  - task: PublishBuildArtifacts@1
    displayName: 'Publish failure traces - ${{ parameters.environment }}'
    condition: always()
    continueOnError: true
    inputs:
      PathtoPublish: '$(Agent.TempDirectory)/reports/failure-traces'
      ArtifactName: 'failure-traces-${{ parameters.testType }}-${{ parameters.environment }}-$(Build.BuildId)'
      publishLocation: Container

