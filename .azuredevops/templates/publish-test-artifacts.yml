parameters:
  - name: environment
    type: string

  - name: testType
    type: string

steps:
  - script: |
      set -euo pipefail

      # Stage reports in the per-job temp dir (unique per run); clear it first.
      REPORT_DIR="$(Agent.TempDirectory)/reports"
      rm -rf "$REPORT_DIR"
      mkdir -p "$REPORT_DIR"

      for d in test-results playwright-report allure-results; do
        if [ -d "$(Build.SourcesDirectory)/$d" ]; then
          mv -f "$(Build.SourcesDirectory)/$d" "$REPORT_DIR/$d"
        fi
      done

      # Ensure a junit.xml exists so the Tests tab reflects this run (empty when tests did not run).
      if [ ! -f "$REPORT_DIR/test-results/junit.xml" ]; then
        mkdir -p "$REPORT_DIR/test-results"
        printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<testsuites tests="0" failures="0" errors="0" skipped="0"><testsuite name="none" tests="0" failures="0" errors="0" skipped="0" time="0"></testsuite></testsuites>' \
          > "$REPORT_DIR/test-results/junit.xml"
      fi

    displayName: 'Stage reports into agent temp dir'
    condition: always()

  - task: PublishTestResults@2
    displayName: 'Publish JUnit results - ${{ parameters.environment }}'
    condition: always()
    inputs:
      testResultsFormat: JUnit
      searchFolder: '$(Agent.TempDirectory)/reports'
      testResultsFiles: 'test-results/junit.xml'
      mergeTestResults: true
      failTaskOnFailedTests: false
      testRunTitle: '${{ parameters.testType }} tests - ${{ parameters.environment }}'

  - script: |
      set -euo pipefail
      node "$(Build.SourcesDirectory)/node_modules/allure/cli.js" generate "$(Agent.TempDirectory)/reports/allure-results" -o "$(Agent.TempDirectory)/reports/allure-report"
    displayName: 'Generate Allure Report'
    condition: always()
    continueOnError: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Allure Report - ${{ parameters.environment }}'
    condition: always()
    continueOnError: true
    inputs:
      PathtoPublish: '$(Agent.TempDirectory)/reports/allure-report'
      ArtifactName: 'allure-report-${{ parameters.testType }}-${{ parameters.environment }}-$(Build.BuildId)'
      publishLocation: Container

  - script: |
      set -euo pipefail
      node "$(Build.SourcesDirectory)/node_modules/allure/cli.js" generate "$(Agent.TempDirectory)/reports/allure-results" --config "$(Build.SourcesDirectory)/allure.share.mjs" -o "$(Agent.TempDirectory)/reports/allure-report-single"
    displayName: 'Generate single-file Allure report'
    condition: always()
    continueOnError: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish single-file Allure report - ${{ parameters.environment }}'
    condition: always()
    continueOnError: true
    inputs:
      PathtoPublish: '$(Agent.TempDirectory)/reports/allure-report-single'
      ArtifactName: 'allure-report-single-${{ parameters.testType }}-${{ parameters.environment }}-$(Build.BuildId)'
      publishLocation: Container

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Playwright HTML report - ${{ parameters.environment }}'
    condition: always()
    continueOnError: true
    inputs:
      PathtoPublish: '$(Agent.TempDirectory)/reports/playwright-report'
      ArtifactName: 'playwright-report-${{ parameters.testType }}-${{ parameters.environment }}-$(Build.BuildId)'
      publishLocation: Container
