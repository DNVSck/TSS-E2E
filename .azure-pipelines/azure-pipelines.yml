
#TODO: Update yml file when pipeline is ready to be used
trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  TEST_ENV: 'staging'

steps:
- checkout: self

- task: NodeTool@0
  displayName: 'Setup Node.js'
  inputs:
    versionSpec: '18.x'

- script: |
    npm install -g pnpm
    pnpm install
  displayName: 'Install Dependencies'

- script: |
    pnpm exec playwright install --with-deps chromium
  displayName: 'Install Playwright'

- script: |
    export ENV=$(TEST_ENV)
    pnpm test
  displayName: 'Run Tests'
  env:
    ENV: $(TEST_ENV)

- task: PublishTestResults@2
  condition: always()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'test-results/**/*.xml'