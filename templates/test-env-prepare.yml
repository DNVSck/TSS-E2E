parameters:
  - name: environment
    type: string

steps:
  - checkout: self

  - script: |
      set -euo pipefail
      cd "$(Build.SourcesDirectory)"

      ENVIRONMENT="${{ parameters.environment }}"

      if [[ ! "$ENVIRONMENT" =~ ^[A-Za-z0-9_-]+$ ]]; then
        echo "ERROR: Invalid environment name: $ENVIRONMENT"
        exit 1
      fi

      echo "Node version:"
      node --version

      echo "Corepack version:"
      corepack --version

      npm config set registry https://registry.npmjs.org/

      echo "Installing dependencies with the pnpm version pinned in package.json..."
      corepack pnpm --version
      corepack pnpm install --frozen-lockfile

      if [ ! -f ".env.example" ]; then
        echo "ERROR: .env.example was not found in $(Build.SourcesDirectory)"
        exit 1
      fi

      ENV_FILE=".env.${ENVIRONMENT}"
      cp .env.example "$ENV_FILE"

      set_env_value() {
        local key="$1"
        local value="$2"

        if grep -q "^${key}=" "$ENV_FILE"; then
          sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
        else
          printf '\n%s=%s\n' "$key" "$value" >> "$ENV_FILE"
        fi
      }

      set_env_value "HEADLESS" "true"
      set_env_value "VIDEO_MODE" "retain-on-failure"

      chmod 600 "$ENV_FILE"

      echo "Environment file created: $ENV_FILE"
      echo "Environment preparation completed for: $ENVIRONMENT"

    displayName: 'Install dependencies and prepare environment'

    env:
      CI: 'true'