parameters:
  - name: environment
    type: string

steps:
  - checkout: self

  - script: |
      cd "$(Build.SourcesDirectory)"
      set -e

      npm config set registry https://registry.npmjs.org/

      echo "Installing dependencies..."
      npx pnpm install --frozen-lockfile

      echo "Preparing environment files..."
      if [ ! -f ".env.example" ]; then
        echo "ERROR: .env.example not found"
        exit 1
      fi

      # 1. Create the env-specific file (e.g., .env.dev)
      ENV_FILE=".env.${{ parameters.environment }}"
      cp .env.example "$ENV_FILE"

      # 2. Inject the variables into that specific file
      sed -i "s|^BASE_URL=.*|BASE_URL=$(BASE_URL)|" "$ENV_FILE"
      sed -i "s|^USER_NAME=.*|USER_NAME=$(USER_NAME)|" "$ENV_FILE"
      sed -i "s|^PASSWORD=.*|PASSWORD=$(PASSWORD)|" "$ENV_FILE"
      sed -i "s|^HEADLESS=.*|HEADLESS=true|" "$ENV_FILE"
      sed -i "s|^VIDEO_MODE=.*|VIDEO_MODE=retain-on-failure|" "$ENV_FILE"

      cp "$ENV_FILE" .env
      echo "Environment: ${{ parameters.environment }} ready"
    displayName: 'Install Dependencies'
    env:
      CI: true
      NPM_TOKEN: $(NPM_TOKEN)
      BASE_URL: $(BASE_URL)
      USER_NAME: $(USER_NAME)
      PASSWORD: $(PASSWORD)
