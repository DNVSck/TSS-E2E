# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript
# Added dev branch for PR trigger

trigger:
- main

pr:
- main
- dev

pool:
  name: Linux
jobs:
  - job: SonarQube
    displayName: 'SonarQube'
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
    - task: NodeTool@0
      inputs:
        versionSpec: '24.x'
      displayName: 'Install Node.js 24.x'
    - task: SonarQubePrepare@7
      displayName: 'Prepare analysis on SonarQube'
      inputs:
        SonarQube: 'NC_SonarQube_E2E'
        scannerMode: CLI
        configMode: 'file'
      timeoutInMinutes: 300    
    - task: SonarQubeAnalyze@7
      displayName: 'Run code analysis on SonarQube'
      env:
        JAVA_HOME: $(JAVA_HOME_21_X64)
        PATH: $(JAVA_HOME_21_X64)/bin:$(PATH)
    - task: SonarQubePublish@7
      displayName: 'Publish analysis results to quality gate on SonarQube'
      inputs:
        pollingTimeoutSec: '600'
      continueOnError: true
      timeoutInMinutes: 300