parameters:
  - name: environment
    displayName: 'Environment to run against'
    type: string
    default: test
    values:
      - test
      - sit
      - dev

  - name: testScope
    displayName: 'Tests to run'
    type: string
    default: smoke
    values:
      - smoke
      - all

  - name: workers
    displayName: 'Parallel Playwright workers'
    type: number
    default: 1
    values:
      - 1
      - 2
      - 3
      - 4

  - name: runAccessibilityTests
    displayName: 'Run Accessibility Tests'
    type: boolean
    default: true

  - name: runFunctionalTests
    displayName: 'Run Functional Tests'
    type: boolean
    default: true

  - name: runAll
    displayName: 'Run All Test Types (overrides selections above)'
    type: boolean
    default: false

variables:
  - group: TSS-Secrets

  - ${{ if eq(parameters.environment, 'dev') }}:
      - group: TSS-Dev

  - ${{ if eq(parameters.environment, 'test') }}:
      - group: TSS-Test

  - ${{ if eq(parameters.environment, 'sit') }}:
      - group: TSS-Sit

trigger: none

pr:
  branches:
    include:
      - dev

pool:
  name: Linux

jobs:
  - job: AccessibilityTests
    displayName: 'Run accessibility tests - ${{ parameters.environment }}'
    timeoutInMinutes: 30
    dependsOn: []
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host --security-opt label=disable
    condition: |
      or(
        eq('${{ parameters.runAll }}', 'True'),
        eq('${{ parameters.runAccessibilityTests }}', 'True'),
        eq(variables['Build.Reason'], 'PullRequest')
      )
    steps:
      - template: templates/run-group-of-tests.yml
        parameters:
          environment: ${{ parameters.environment }}
          testType: 'accessibility'
          testScope: ${{ parameters.testScope }}
          workers: ${{ parameters.workers }}'

  - job: FunctionalTests
    displayName: 'Run functional tests - ${{ parameters.environment }}'
    timeoutInMinutes: 60
    dependsOn: []
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host --security-opt label=disable
    condition: |
      or(
        eq('${{ parameters.runAll }}', 'True'),
        eq('${{ parameters.runFunctionalTests }}', 'True'),
        eq(variables['Build.Reason'], 'PullRequest')
      )
    steps:
      - template: templates/run-group-of-tests.yml
        parameters:
          environment: ${{ parameters.environment }}
          testType: 'functional'
          testScope: ${{ parameters.testScope }}
          workers: ${{ parameters.workers }}
